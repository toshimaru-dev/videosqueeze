<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VideoSqueeze</title>
  <meta name="description" content="送信先の容量制限に合わせて、iPhone の中で動画を圧縮するアプリ。">
  <link rel="icon" href="favicon.png">
  <link rel="apple-touch-icon" href="icon.png">

<body>
  <div class="wrap">
    <header class="site-header">
      <a href="./"><img src="icon.png" alt=""></a>

    <main>
      <section class="hero">
        <img src="icon.png" alt="VideoSqueeze のアイコン">
        <h1>VideoSqueeze</h1>
        <p class="lead">送信先の容量制限に合わせて、iPhone の中で動画を圧縮。</p>
      </section>

      <div class="card">
        <ul>
          <li>Discord・LINE・X などの容量制限に合わせたプリセットを選ぶだけ</li>
          <li>1〜4096 MB の目標サイズを自由に指定し、名前を付けて保存</li>
          <li>動画の長さから必要なビットレートを自動で計算</li>
          <li>変換はすべて端末内で完結。動画をサーバーへ送りません</li>
        </ul>
      </div>

      <div class="links">
        <a href="support.html">サポート<span>使い方・よくある質問・お問い合わせ</span></a>
        <a href="privacy-policy.html">プライバシーポリシー<span>Privacy Policy</span></a>
